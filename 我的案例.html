<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的實作案例</title><meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#1a4dba">
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1d2024;--muted:#5d636d;--line:#e2e1db;--accent:#1a4dba;--err:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--panel:#1d2024;--ink:#e7e8ea;--muted:#9aa1ab;--line:#2f333a;--accent:#6eb1f4;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171a;--panel:#1d2024;--ink:#e7e8ea;--muted:#9aa1ab;--line:#2f333a;--accent:#6eb1f4;--err:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
.box{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.logo{width:56px;height:56px;border-radius:14px;display:block;margin:0 auto 12px}
h1{font-size:19px;text-align:center;margin:0 0 4px}p.s{color:var(--muted);text-align:center;margin:0 0 18px;font-size:14px}
input[type=password]{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:0 14px}
input[type=password]:focus{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:12px 0 16px}
button{width:100%;height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.err{color:var(--err);font-size:14px;min-height:22px;margin-top:10px;text-align:center}
</style></head><body>
<form class="box" id="f" autocomplete="on">
  <img class="logo" src="icon-192.png" alt="">
  <h1>🔐 我的實作案例</h1><p class="s">個人頁：請輸入你拿到的密碼<br>還沒有密碼的話，請先向作者申請</p>
  <input type="password" id="pw" autocomplete="current-password" placeholder="密碼" required>
  <label><input type="checkbox" id="rm" checked> 在這台裝置記住（下次不用再輸入）</label>
  <button id="go">開啟</button><div class="err" id="err" role="alert"></div>
</form>

<script>
(function(){
  try{var t=localStorage.getItem('tb-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}
  var KEY='tb-pw2',parts=document.getElementById('enc').textContent.trim().split('.');
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function hex(s){var u=new Uint8Array(s.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(s.substr(i*2,2),16);return u;}
  async function aes(k,iv,data){var key=await crypto.subtle.importKey('raw',k,'AES-CBC',false,['decrypt']);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC',iv:iv},key,data));}
  async function decrypt(pw){
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    var bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:hex(parts[0]),iterations:200000,hash:'SHA-256'},km,384));
    var wraps=parts[1].split(','),body=b64(parts[2]);
    for(var i=0;i<wraps.length;i++){
      try{var ck=await aes(bits.slice(0,32),bits.slice(32,48),b64(wraps[i]));if(ck.length<48)continue;
        var html=new TextDecoder('utf-8').decode(await aes(ck.slice(0,32),ck.slice(32,48),body));
        if(/^\s*<!doctype/i.test(html))return mark(html,new TextDecoder('utf-8').decode(ck.slice(48)));}catch(e){}
    }
    throw new Error('bad');}
  // 浮水印：別人打開時，整頁淡淡地重複「僅供 名字 閱讀・日期」；截圖外流也看得出是誰的
  function esc(s){return s.replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';';});}
  function mark(html,who){
    var css='<style>@media print{body>*{display:none!important}body::before{content:"此頁不提供列印";display:block;padding:40px;font-size:20px}}</style>';
    if(!who)return html.replace(/<\/head>/i,css+'</head>');
    var d=new Date(),t=esc('僅供 '+who+' 閱讀・'+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate());
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200"><text x="10" y="110" transform="rotate(-24 160 100)" font-size="15" font-family="sans-serif" fill="rgb(128,128,128)" fill-opacity="0.16">'+t+'</text></svg>';
    var wm='<div aria-hidden="true" style="position:fixed;inset:0;z-index:2147483646;pointer-events:none;background-image:url(&quot;data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg).replace(/'/g,'%27')+'&quot;)"></div>';
    return html.replace(/<\/head>/i,css+'</head>').replace(/<\/body>/i,wm+'</body>');}
  function show(html){document.open();document.write(html);document.close();}
  var stored=null;try{stored=localStorage.getItem(KEY)||sessionStorage.getItem(KEY);}catch(e){}
  var f=document.getElementById('f'),pw=document.getElementById('pw'),rm=document.getElementById('rm'),go=document.getElementById('go'),err=document.getElementById('err');
  if(!window.crypto||!crypto.subtle){err.textContent='這個瀏覽器不支援解密，請用 Safari、Chrome 或 Edge 開啟（網址要是 https）。';go.disabled=true;}
  else if(stored){f.style.visibility='hidden';decrypt(stored).then(show,function(){try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY);}catch(e){}f.style.visibility='';err.textContent='之前記住的密碼已經失效，請重新輸入或向作者申請。';});}
  f.addEventListener('submit',function(e){e.preventDefault();var p=pw.value;if(!p)return;go.disabled=true;go.textContent='解密中…';err.textContent='';
    decrypt(p).then(function(h){try{(rm.checked?localStorage:sessionStorage).setItem(KEY,p);}catch(e){}show(h);},
      function(){go.disabled=false;go.textContent='開啟';err.textContent='密碼不對，請再試一次。';pw.select();});});
})();
</script>
