<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1d2024;--muted:#5d636d;--line:#e2e1db;--accent:#1a4dba;--err:#c0392b}

:root[data-theme="dark"]{--bg:#15171a;--panel:#1d2024;--ink:#e7e8ea;--muted:#9aa1ab;--line:#2f333a;--accent:#6eb1f4;--err:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}

.logo{width:56px;height:56px;border-radius:14px;display:block;margin:0 auto 12px}
h1{font-size:19px;text-align:center;margin:0 0 4px}p.s{color:var(--muted);text-align:center;margin:0 0 18px;font-size:14px}
input[type=password]{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:0 14px}
input[type=password]:focus{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:12px 0 16px}
button{width:100%;height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.err{color:var(--err);font-size:14px;min-height:22px;margin-top:10px;text-align:center}
</style></head><body>

<script>
(function(){
  try{var t=localStorage.getItem('tb-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}
  var KEY='tb-pw',enc=document.getElementById('enc').textContent.trim();
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  async function decrypt(pw){var d=b64(enc),salt=d.slice(8,16),ct=d.slice(16);
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    var bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},km,384));
    var key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,ct);
    return new TextDecoder('utf-8').decode(pt);}
  function show(html){document.open();document.write(html);document.close();}
  var stored=null;try{stored=localStorage.getItem(KEY)||sessionStorage.getItem(KEY);}catch(e){}
  var f=document.getElementById('f'),pw=document.getElementById('pw'),rm=document.getElementById('rm'),go=document.getElementById('go'),err=document.getElementById('err');
  if(!window.crypto||!crypto.subtle){err.textContent='這個瀏覽器不支援解密，請用 Safari、Chrome 或 Edge 開啟（網址要是 https）。';go.disabled=true;}
  else if(stored){f.style.visibility='hidden';decrypt(stored).then(show,function(){try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY);}catch(e){}f.style.visibility='';});}
  f.addEventListener('submit',function(e){e.preventDefault();var p=pw.value;if(!p)return;go.disabled=true;go.textContent='解密中…';err.textContent='';
    decrypt(p).then(function(h){try{(rm.checked?localStorage:sessionStorage).setItem(KEY,p);}catch(e){}show(h);},
      function(){go.disabled=false;go.textContent='開啟';err.textContent='密碼不對，請再試一次。';pw.select();});});
})();
</script>
